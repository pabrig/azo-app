name: CI

on:
  pull_request:
  push:
    branches: [main, feature/**, chore/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site and config
        run: bash scripts/ci-check.sh
